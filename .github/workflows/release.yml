name: Release

on:
  push:
    branches:
      - "main"
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release_font:
    if: github.repository_owner == 'myridia'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release
        if: github.repository_owner == 'myridia'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: 'Myridia-Normal.otf'
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
